name: Project 18 - GitOps Infrastructure Deployment

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merged code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Initialize
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: project-18-terraform-plan
          path: tfplan
          retention-days: 5

  terraform-apply:
    name: Terraform Apply - Disabled Pending Authorization
    needs: terraform-plan
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Terraform Apply
        run: echo "Deployment is disabled pending AWS authorization and independent approval."
